[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seerdb"
version = "3.5.0"
description = "Pure-Python client and server for a proprietary database's wire protocol: talk to it from Python (8i-26ai), or serve its clients from PostgreSQL. No vendor libraries."
readme = "README.md"
license = "MIT"
license-files = ["LICENSES/MIT.txt"]
requires-python = ">=3.10"
authors = [
    { name = "Peter Lemenkov", email = "lemenkov@gmail.com" },
]

dependencies = [
    "pycryptodome",
    # Supplies the IANA tz database for `zoneinfo` so named-region TIMESTAMP
    # WITH TIME ZONE values resolve where the OS ships no system zoneinfo
    # (e.g. Windows, slim containers). A no-op where system tzdata exists.
    "tzdata",
    # Arrow / DataFrame bulk fetch (#162): cursor.fetch_df_all/_batches return
    # a pyarrow.Table for fast hand-off to pandas / Polars / pyarrow.
    "pyarrow",
]

[project.optional-dependencies]
# Both extras below pull in `cryptography` — the same library python-oracledb-thin
# uses — for the two features pycryptodome can't cover. It is kept OPTIONAL so the
# core install stays lean, and every module that needs it (`seerdb.client.wallet`,
# `seerdb.common.token_auth`) is imported lazily, only when that connection kind is
# actually requested — so `import seerdb` still works without it installed.
#
# Wallet-based mutual TLS (#127): reading an Oracle/ADB wallet needs X.509 / PKCS#12
# decoding.
wallet = ["cryptography>=3.3"]
# Token-based auth (#125): OAuth2 / OCI IAM sign the auth header with RSA-SHA256.
token = ["cryptography>=3.3"]
# The Mirror (seerdb.server), a technology preview: what its backends need. The
# PostgreSQL backend speaks to PostgreSQL through psycopg 3.2 or later (it
# renders SQL literals without a connection, which 3.1 cannot). Only that
# backend imports it, so `import seerdb` works without it.
mirror = ["psycopg[binary]>=3.2"]
# The ws:// / wss:// transport (#1988), a seerdb extension: TNS framing carried
# in WebSocket binary messages, to a bridge or a Mirror that speaks it. The
# `websockets` package provides the sync and async clients (recv(timeout=)
# needs 13+). Imported lazily by seerdb.client._ws, only when a ws/wss dsn is
# used, so `import seerdb` works without it.
ws = ["websockets>=13"]

[project.scripts]
seerdb-mirror = "seerdb.server.launcher:main"

[project.urls]
Homepage = "https://github.com/seerdb/seerdb"

[tool.setuptools.packages.find]
include = ["seerdb*"]

[tool.setuptools.package-data]
# PEP 561 marker so type checkers (mypy, pyright) treat seerdb as typed.
seerdb = ["py.typed"]

[tool.mypy]
python_version = "3.10"
files = ["seerdb", "examples", "tools", "tests"]
# A test module is reached both by the files list and by the fuzz tool's import
# of it; naming modules from the project root keeps that one module, not two.
explicit_package_bases = true
# Runtime deps (pycryptodome, pyarrow) ship no stubs; treat them as Any.
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
# The codebase leans single-quoted; normalise to that rather than flipping ~1400
# strings to double.
quote-style = "single"

[tool.ruff.lint]
# Start focused, like the mypy rollout: real correctness (pyflakes) + import
# order; `ruff format` owns the cosmetic side. The opinionated families (SIM, B,
# UP, and the churnier pycodestyle rules) can be ratcheted in later.
select = ["F", "W", "I", "E9"]
# The wire code uses house-convention CamelCase locals and a few single-letter
# names; the naming rules (N*) are deliberately not selected.
