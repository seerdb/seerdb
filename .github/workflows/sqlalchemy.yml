# Does this driver still pass the released SQLAlchemy dialect's compliance
# suite? The dialect (sqlalchemy-seerdb) is checked out at its newest git tag,
# the driver comes from this checkout, and SQLAlchemy's own dialect compliance
# suite runs against two live servers: the oldest the dialect reaches and a
# current one. The setup mirrors the dialect's own CI, which is where the
# grants and the tablespace step were learned the hard way.
name: SQLAlchemy

on:
  # Only the client and the codec reach a real Oracle; a Mirror-only change
  # (seerdb/server, examples/) cannot change this run's outcome (#1470).
  push:
    branches: [master]
    paths:
      - 'seerdb/client/**'
      - 'seerdb/common/**'
      - 'seerdb/__init__.py'
      - 'seerdb/py.typed'
      - 'pyproject.toml'
      - '.github/workflows/sqlalchemy.yml'
  pull_request:
    # ready_for_review: a draft skips the heavy jobs below, which run once it
    # is undrafted (#1942).
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    paths:
      - 'seerdb/client/**'
      - 'seerdb/common/**'
      - 'seerdb/__init__.py'
      - 'seerdb/py.typed'
      - 'pyproject.toml'
      - '.github/workflows/sqlalchemy.yml'
  # On demand and weekly: release against release, this driver at its newest
  # tag with the dialect at its newest tag, the pairing a user installs.
  workflow_dispatch:
    inputs:
      driver:
        description: "checkout (this code) | tag (this repository's newest git tag)"
        required: false
        default: "tag"
        type: string
      dialect:
        description: "tag (the dialect's newest git tag) | pypi (its newest PyPI release, harness from the matching tag)"
        required: false
        default: "pypi"
        type: string
  schedule:
    - cron: "47 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The SQLAlchemy the compliance suite runs against: one exact version, never a
  # range or the newest release, so a run changes only when this line does. A
  # newer SQLAlchemy is a deliberate upgrade of its own (#1199).
  SQLALCHEMY: "2.1.6"

jobs:
  compliance:
    name: SQLAlchemy compliance (${{ matrix.db.name }}, driver ${{ inputs.driver || (github.event_name == 'schedule' && 'tag') || 'checkout' }}, dialect ${{ inputs.dialect || (github.event_name == 'schedule' && 'pypi') || 'tag' }})
    # A draft waits for ready_for_review (#1942).
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db:
          - name: "11g"
            image: "gvenzl/oracle-xe:11-slim"
            service: "XE"
          - name: "23ai Free"
            image: "gvenzl/oracle-free:23-slim"
            service: "FREEPDB1"
    services:
      oracle:
        image: ${{ matrix.db.image }}
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: pyo
          APP_USER_PASSWORD: pyo123
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 40
          --health-start-period 90s
          --shm-size=2g
    env:
      # Pushes and pull requests test the checkout; a dispatch defaults to the
      # newest tag and the weekly run always uses it.
      DRIVER: ${{ inputs.driver || (github.event_name == 'schedule' && 'tag') || 'checkout' }}
      # Pushes and pull requests take the dialect from its newest git tag,
      # robust to PyPI's index lag; a dispatch defaults to its newest PyPI
      # release and the weekly run always uses it: the artifact a user installs.
      DIALECT: ${{ inputs.dialect || (github.event_name == 'schedule' && 'pypi') || 'tag' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use this repository's newest tag
        if: env.DRIVER == 'tag'
        run: |
          TAG=$(git tag --list | grep -E '^v?[0-9]+(\.[0-9]+)+$' | sort -V | tail -1)
          echo "newest seerdb tag: $TAG"
          git checkout -q "$TAG"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The wheel ships only the package; the compliance harness (test/,
      # conftest.py, the mandatory test.cfg) lives in the repository, so the
      # `pypi` mode installs the release and checks out the repository at the
      # tag matching the installed version, for the harness alone.
      - name: Resolve the dialect
        id: dialect
        run: |
          if [ "$DIALECT" = "pypi" ]; then
            pip install "sqlalchemy-seerdb[test]" "SQLAlchemy==$SQLALCHEMY"
            TAG=$(pip show sqlalchemy-seerdb | awk '/^Version:/{print $2}')
            echo "newest sqlalchemy-seerdb release on PyPI: $TAG"
          else
            TAG=$(git ls-remote --tags --refs https://github.com/seerdb/sqlalchemy-seerdb \
                  | sed 's#.*/##' | grep -E '^v?[0-9]+(\.[0-9]+)+$' | sort -V | tail -1)
            if [ -z "$TAG" ]; then
              echo "::warning::the dialect has no release tag yet; testing its master instead"
              TAG=master
            fi
            echo "newest sqlalchemy-seerdb tag: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Check out the dialect at that tag
        uses: actions/checkout@v7
        with:
          repository: seerdb/sqlalchemy-seerdb
          ref: ${{ steps.dialect.outputs.tag }}
          path: dialect
      # The dialect's test extras bring SQLAlchemy and pytest, and its
      # dependency floor may pull a released driver from PyPI; the driver from
      # this checkout goes on top of it afterwards, force-reinstalled because
      # master carries the last release's version string until the next bump.
      - name: Install the dialect from the checkout
        if: env.DIALECT != 'pypi'
        run: pip install "./dialect[test]" "SQLAlchemy==$SQLALCHEMY"
      # pytest runs from the dialect checkout, where its package directory
      # would shadow the installed wheel; in the `pypi` mode only the harness
      # stays.
      - name: Keep only the harness from the checkout
        if: env.DIALECT == 'pypi'
        run: rm -rf dialect/sqlalchemy_seerdb
      - name: This driver on top
        run: pip install --force-reinstall --no-deps .
      - name: Which driver and dialect this run uses
        run: |
          python -c "import sqlalchemy; print('SQLAlchemy', sqlalchemy.__version__)"
          python -c "import seerdb, inspect, pathlib; print('driver from:', pathlib.Path(inspect.getfile(seerdb)).parent)"
          python -c "import sqlalchemy_seerdb, inspect, pathlib; print('dialect', sqlalchemy_seerdb.__version__, 'from:', pathlib.Path(inspect.getfile(sqlalchemy_seerdb)).parent, '| harness at', '${{ steps.dialect.outputs.tag }}')"
          pip show seerdb | grep -E '^(Version|Location)'
      # SQLAlchemy's suite requires a second namespace called test_schema, which
      # on this backend is a username, and the test account has to be able to
      # create and drop tables inside it. The test user's own tables must live
      # in the USERS tablespace: the Oracle dialect hides SYSTEM-tablespace
      # tables from reflection, and the suite then never empties them between
      # tests. The broad ANY-object grants are deliberate and safe *here*: this
      # container is created for one run and thrown away.
      - name: Create the test_schema namespace
        run: |
          python - <<'PY'
          import seerdb

          conn = seerdb.connect(
              host='localhost', port=1521, service_name='${{ matrix.db.service }}',
              user='system', password='oracle',
          )
          cur = conn.cursor()
          statements = [
              'ALTER USER pyo DEFAULT TABLESPACE USERS',
              'ALTER USER pyo QUOTA UNLIMITED ON USERS',
              'CREATE USER test_schema IDENTIFIED BY test_schema',
              'GRANT CREATE SESSION TO test_schema',
              'ALTER USER test_schema DEFAULT TABLESPACE USERS',
              'GRANT UNLIMITED TABLESPACE TO test_schema',
              'GRANT CREATE ANY TABLE, DROP ANY TABLE, SELECT ANY TABLE, '
              'INSERT ANY TABLE, UPDATE ANY TABLE, DELETE ANY TABLE, '
              'CREATE ANY INDEX, DROP ANY INDEX, CREATE ANY VIEW, '
              'DROP ANY VIEW, CREATE ANY SEQUENCE, DROP ANY SEQUENCE, '
              'SELECT ANY SEQUENCE, '
              'COMMENT ANY TABLE, ANALYZE ANY TO pyo',
          ]
          for statement in statements:
              try:
                  cur.execute(statement)
              except Exception as exc:  # already present from a previous attempt
                  print(f'skipped: {statement[:40]}... -> {exc}')
          conn.commit()
          conn.close()
          print('test_schema ready')
          PY
      # Gating: a driver change that breaks the released dialect is a
      # regression. The suite runs from the dialect checkout, where its
      # mandatory test.cfg lives.
      - name: Run the compliance suite against ${{ matrix.db.name }}
        working-directory: dialect
        run: >-
          python -m pytest -q --tb=short
          --dburi "oracle+seerdb://pyo:pyo123@localhost:1521/?service_name=${{ matrix.db.service }}"
