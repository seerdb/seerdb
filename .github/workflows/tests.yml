name: Tests

on:
  push:
    branches: [master]
    # Docs-only changes don't affect the driver, so skip the (expensive, live-
    # Oracle) test runs when nothing outside these paths changed. A commit that
    # also touches code still runs — the filter only skips when every changed
    # file matches. (CI budget, #7)
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'docs/**'
      - 'ChangeLog'
      - 'LICENSES/**'
      - 'NOTICE'
      - 'REUSE.toml'
      - '.gitignore'
      - '.git-blame-ignore-revs'
      - '.github/dependabot.yml'
  pull_request:
    # ready_for_review: a draft skips the heavy jobs below, which run once it
    # is undrafted (#1942).
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'docs/**'
      - 'ChangeLog'
      - 'LICENSES/**'
      - 'NOTICE'
      - 'REUSE.toml'
      - '.gitignore'
      - '.git-blame-ignore-revs'
      - '.github/dependabot.yml'
  # Nightly, and on demand: every leg, whatever changed, so a leg the path gate
  # below skipped cannot hide a regression for longer than a day (#1470).
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# Cancel a superseded run when a new commit is pushed to the same ref, so rapid
# pushes don't stack up and exhaust the Actions concurrency/usage budget.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which integration legs this change can reach (#1470). The direct Oracle legs
  # load only the client and the codec; the Mirror legs load all of seerdb --
  # the seerdb client is what talks to the Mirror, so a client change can break
  # one -- plus the Mirror launchers in examples/. The harness reaches
  # every leg. A change to the shared suite alone runs the Mirror leg but not
  # the Oracle ones: nearly every Mirror fix adds a test there, and gating the
  # Oracle legs on it would run them for every PR. Such a test is checked
  # against every Oracle release in the local matrix before a PR opens, and the
  # nightly run below takes every leg. A scheduled or manual run, and a push
  # whose base is unknown (a new branch), runs everything.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      oracle: ${{ steps.gate.outputs.oracle }}
      mirror: ${{ steps.gate.outputs.mirror }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          SHARED='^(tests/conftest\.py|pyproject\.toml|\.github/workflows/tests\.yml)$'
          ORACLE='^(seerdb/client/|seerdb/common/|seerdb/__init__\.py$|seerdb/py\.typed$)'
          MIRROR='^(seerdb/|examples/|tests/test_integration\.py$|tests/test_postgres_backend\.py$)'
          # The passthrough backend relays to Oracle; no Mirror-over-PG leg loads it.
          NOT_MIRROR='^seerdb/server/backends/passthrough\.py$'
          case "$EVENT" in
            pull_request) BASE=$PR_BASE ;;
            push) BASE=$PUSH_BASE ;;
            *) BASE= ;;
          esac
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "oracle=true" >> "$GITHUB_OUTPUT"
            echo "mirror=true" >> "$GITHUB_OUTPUT"
            echo "no base to diff against: every leg runs"
            exit 0
          fi
          FILES=$(git diff --name-only "$BASE" HEAD)
          echo "$FILES"
          if echo "$FILES" | grep -Eq "$SHARED|$ORACLE"; then oracle=true; else oracle=false; fi
          if echo "$FILES" | grep -Ev "$NOT_MIRROR" | grep -Eq "$SHARED|$MIRROR"; then mirror=true; else mirror=false; fi
          echo "oracle=$oracle" >> "$GITHUB_OUTPUT"
          echo "mirror=$mirror" >> "$GITHUB_OUTPUT"
          echo "Oracle legs: $oracle, Mirror legs: $mirror"

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Install the package so runtime deps (pycryptodome, tzdata) are present
      # for every offline module. The DB-backed integration tests skip
      # automatically without SEERDB_TEST_USER.
      - run: pip install . pytest
      - run: >-
          python -m unittest -v
          tests.test_crypto
          tests.test_tns_decode
          tests.test_tns_encode
          tests.test_tns_types
          tests.test_api_conveniences
          tests.test_connection
      # Every temporal bind encoding against python-oracledb's (#1338).
      - run: python -m pytest -q tests/test_temporal_bind_grid.py

  # Static type-check gate (#232). Enforces mypy on the already-clean modules;
  # the larger driver modules are exempt via [tool.mypy] overrides until cleaned
  # incrementally, so the list ratchets down over time.
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install . mypy
      - run: python -m mypy

  # What the built wheel and sdist contain (#1684): the whole package, the Mirror
  # included, and nothing else; psycopg only behind the `mirror` extra; and
  # `import seerdb` loading neither the Mirror nor a backend's driver. The tests
  # build the distribution themselves, so nothing slips in or drops out unseen.
  packaging:
    name: Distribution contents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install . build pytest "setuptools>=68"
      - run: python -m pytest -q tests/test_packaging.py

  # Integration tests against a real Oracle server, run across three testbeds
  # (#28, #52): 11g (:1521/XE), 21c (:1521/XEPDB1, field version 16) and 23ai
  # Free (:1521/FREEPDB1, field version 17). fail-fast is off so a flake on one
  # DB doesn't cancel the others; a generous --shm-size keeps the memory-fragile
  # 21c/23ai containers from OOM-stalling under the suite.
  integration:
    name: Integration tests (${{ matrix.db.name }})
    needs: changes
    if: needs.changes.outputs.oracle == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        db:
          - name: "Oracle XE 11g"
            image: "gvenzl/oracle-xe:11-slim"
            service: "XE"
            field_version: "0"
          # 18c negotiates field version 11 by itself -- the only release here
          # in the 12.2-19c band, where a reply field that follows the server's
          # release rather than the negotiated version went unnoticed (#1145).
          - name: "Oracle XE 18c"
            image: "gvenzl/oracle-xe:18-slim"
            service: "XEPDB1"
            field_version: "0"
          - name: "Oracle XE 21c"
            image: "gvenzl/oracle-xe:21-slim"
            service: "XEPDB1"
            field_version: "16"
          - name: "Oracle 23ai Free"
            image: "gvenzl/oracle-free:23-slim"
            service: "FREEPDB1"
            field_version: "17"
          # The 12.1 wire format, from a client that negotiates 12.1 with a
          # newer server -- exactly what a real 12.1 client does. No image
          # negotiates 7 on its own, which is how every 12.1 execute went out
          # misframed unseen (#1144).
          - name: "Oracle 23ai Free at 12.1"
            image: "gvenzl/oracle-free:23-slim"
            service: "FREEPDB1"
            field_version: "7"
    services:
      oracle:
        image: ${{ matrix.db.image }}
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: pyo
          APP_USER_PASSWORD: pyo123
        ports:
          - 1521:1521
        # The gvenzl image ships healthcheck.sh; wait for first-boot setup
        # (slower on 21c) before the test step. --shm-size gives the 21c
        # instance enough shared memory to run the full suite without OOM.
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 40
          --health-start-period 90s
          --shm-size=2g
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install .
      # 11g XE's listener refuses logins with ORA-12516 once the suite's
      # connection churn outruns its count of sessions that have closed, and
      # the slim image is sized for light use. Give it headroom (#1229); the
      # suite also replays a test refused that way.
      - name: Give 11g XE more processes and sessions
        if: matrix.db.name == 'Oracle XE 11g'
        run: |
          docker exec -i ${{ job.services.oracle.id }} sqlplus -s / as sysdba <<'SQL'
          set heading off feedback off
          select 'before: ' || name || ' = ' || value from v$parameter where name in ('processes', 'sessions');
          alter system set processes = 200 scope = spfile;
          alter system set sessions = 322 scope = spfile;
          shutdown immediate
          startup
          alter system register;
          select 'after: ' || name || ' = ' || value from v$parameter where name in ('processes', 'sessions');
          exit
          SQL
          python - <<'PY'
          import time

          import seerdb

          last = None
          for attempt in range(60):
              try:
                  seerdb.connect(user='pyo', password='pyo123', host='localhost',
                                 port=1521, service_name='XE').close()
                  print(f'11g XE accepts logins again (attempt {attempt + 1})')
                  break
              except seerdb.Error as exc:
                  last = exc
                  time.sleep(2)
          else:
              raise SystemExit(f'11g XE did not come back: {last}')
          PY
      # Grants, a BFILE directory and a proxy target for the tests that
      # otherwise skip on configuration alone (#2455). The admin tests use
      # SYSTEM, set below, so no admin account is made here.
      - name: Set the test bed up
        run: |
          docker cp tools/test_bed_setup.sql ${{ job.services.oracle.id }}:/tmp/seerdb_bed_setup.sql
          if [ "${{ matrix.db.service }}" = XE ]; then
            PDB=''
          else
            PDB='alter session set container = ${{ matrix.db.service }};'
          fi
          printf '%s\n@/tmp/seerdb_bed_setup.sql pyo\n' "$PDB" |
            docker exec -i ${{ job.services.oracle.id }} sqlplus -s / as sysdba
      - name: Run integration suite against ${{ matrix.db.name }}
        env:
          SEERDB_TEST_USER: pyo
          SEERDB_TEST_PASSWORD: pyo123
          SEERDB_TEST_HOST: localhost
          SEERDB_TEST_PORT: "1521"
          SEERDB_TEST_SERVICE: ${{ matrix.db.service }}
          SEERDB_TEST_FIELD_VERSION: ${{ matrix.db.field_version }}
          # DBA login for the pre-SHA-2 verifier login test (#311): it forges a
          # throwaway 11g-only account. The gvenzl images set SYSTEM to
          # ORACLE_PASSWORD. Harmless on 11g (that test skips on a pre-12c server).
          SEERDB_TEST_ADMIN_USER: system
          SEERDB_TEST_ADMIN_PASSWORD: oracle
          # Made by tools/test_bed_setup.sql in the step above (#2455).
          SEERDB_TEST_BFILE_DIR: SEERDB_BFILE_DIR
          SEERDB_TEST_PROXY_USER: seerdb_proxy_target
          # Pace logins under XE's logon-storm throttle (ORA-01013), and retry a
          # whole test that still trips it.
          SEERDB_TEST_CONNECT_DELAY: "0.25"
          SEERDB_TEST_THROTTLE_RETRIES: "4"
          SEERDB_TEST_THROTTLE_DELAY: "1.0"
        run: python -m unittest -v tests.test_integration

  # The same integration suite, driven through the Mirror over a PostgreSQL
  # backend (`seerdb-mirror postgres`): a real seerdb client talks to the
  # Mirror, which serves every statement from PostgreSQL via the dialect
  # translator. Regressions in the backend or the Mirror's thin path used to go
  # unnoticed because nothing ran the suite this way. PostgreSQL comes from the
  # repo's own image (orafce built from source), started as a container in the
  # job; the Mirror runs in the background of the test step so it is torn down
  # with it. The backend's own unit module runs here too — it needs psycopg and
  # a reachable PostgreSQL, so it is skipped everywhere else. The Mirror presents
  # 23ai, its default, and once more 12.1, so the older release's dialect stays
  # covered (#1747).
  mirror-postgres:
    name: Integration tests (Mirror over PostgreSQL, ${{ matrix.presents }}${{ matrix.setup == 'oldest' && ', oldest supported PostgreSQL' || '' }})
    needs: changes
    if: needs.changes.outputs.mirror == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Even a failure to build the oldest setup's image doesn't fail the run.
    continue-on-error: ${{ matrix.setup == 'oldest' }}
    strategy:
      fail-fast: false
      matrix:
        presents: ["23ai", "12.1"]
        setup: [newest]
        include:
          # The oldest setup the Mirror supports (#2668): what it lacks is
          # documented (docs/MIRROR.md, *By PostgreSQL version*), not worked
          # around, so this entry never fails. Its failures are listed in the
          # job's summary instead.
          - presents: "23ai"
            setup: oldest
            build_args: >-
              --build-arg PG_IMAGE=postgres:16.14-alpine3.24
              --build-arg PGVECTOR_VERSION=v0.8.0
              --build-arg PLPGSQL_CHECK_VERSION=v2.10.11
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ".[mirror]" pytest
      - name: Build and start PostgreSQL with orafce
        run: |
          docker build -f examples/mirror-pg.Dockerfile ${{ matrix.build_args }} -t mirror-pg .
          docker run -d --name mirror-pg -p 5433:5432 \
            -e POSTGRES_USER=pyo -e POSTGRES_PASSWORD=pyo123 -e POSTGRES_DB=mirror \
            mirror-pg
          # The image's first boot runs a temporary socket-only server for its init
          # scripts and shuts it down before the real one starts, so probe over
          # TCP, which only the real server answers. orafce is a hard requirement
          # of the backend, not a nice-to-have: prove the extension loads and its
          # functions resolve as part of the readiness check, or fail here.
          for i in $(seq 1 60); do
            if docker exec mirror-pg psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U pyo -d mirror \
                 -c "CREATE EXTENSION IF NOT EXISTS orafce" \
                 -c "SELECT oracle.nvl(NULL::text, 'orafce ok'), oracle.add_months(DATE '2026-01-31', 1)"; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL with orafce never became ready"; docker logs mirror-pg; exit 1
      - name: Run the backend unit module and the integration suite through the Mirror
        env:
          MIRROR_PG: "host=localhost port=5433 user=pyo password=pyo123 dbname=mirror"
          SEERDB_TEST_USER: pyo
          SEERDB_TEST_PASSWORD: pyo123
          SEERDB_TEST_HOST: 127.0.0.1
          SEERDB_TEST_PORT: "1521"
          SEERDB_TEST_SERVICE: XE
          # This job starts the Mirror itself rather than going through
          # tools/run_mirror_suite.py, so it has to declare what it is talking
          # to: a test for something the Mirror does not serve yet skips on
          # this, instead of failing as though the client were at fault (#964).
          SEERDB_TEST_MIRROR: "1"
          MIRROR_PRESENTS: ${{ matrix.presents }}
          SETUP: ${{ matrix.setup }}
        run: |
          # A failing pytest must not hide behind `tee`'s status.
          set -o pipefail
          # The oldest setup's failures are reported, not raised (#2668): each
          # run keeps going, and the summary lists what failed.
          oldest_failed=0
          report() {
            if [ "$SETUP" = "oldest" ] && [ "$1" -ne 0 ]; then
              oldest_failed=1
              {
                echo "### $2: fails on the oldest supported PostgreSQL"
                echo '```'
                grep -E '^(FAILED|ERROR) ' "$3" || tail -n 20 "$3"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            return "$1"
          }
          # The backend's unit module presents what each test asks for, so one
          # entry of the matrix runs it.
          if [ "$MIRROR_PRESENTS" = "23ai" ]; then
            backend=0
            python -m pytest -q -rfE tests/test_postgres_backend.py 2>&1 | tee backend.out || backend=$?
            report "$backend" "tests/test_postgres_backend.py" backend.out
          fi
          # The packaged launcher, as a user runs it: `pip install ".[mirror]"`
          # installed this checkout. PYO is the suite's account (#1835).
          # The suite connects as service XE, which the database isn't named.
          MIRROR_USERS=pyo:pyo123 seerdb-mirror --port 1521 --service XE \
            postgres "$MIRROR_PG" --presents "$MIRROR_PRESENTS" > mirror.log 2>&1 &
          MIRROR_PID=$!
          for i in $(seq 1 30); do
            python -c "import socket; socket.create_connection(('127.0.0.1', 1521), timeout=1).close()" 2>/dev/null && break
            sleep 1
          done
          if ! kill -0 "$MIRROR_PID" 2>/dev/null; then
            echo "the Mirror exited during startup"; cat mirror.log; exit 1
          fi
          status=0
          # pytest rather than unittest, matching the step above and
          # tools/run_mirror_suite.py, which is how this same run is done
          # locally. The whole suite runs: nothing is skipped here any more.
          python -m pytest -q -rfE --tb=short tests/test_integration.py 2>&1 | tee integration.out || status=$?
          kill "$MIRROR_PID" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then echo "--- mirror log ---"; tail -n 200 mirror.log; fi
          report "$status" "tests/test_integration.py" integration.out || exit $?
          if [ "$oldest_failed" -ne 0 ]; then
            echo "::warning title=Oldest supported PostgreSQL::tests fail on PostgreSQL 16.14; see the job summary, and docs/MIRROR.md *By PostgreSQL version*"
          elif [ "$SETUP" = "oldest" ]; then
            echo "Everything passes on the oldest supported PostgreSQL." >> "$GITHUB_STEP_SUMMARY"
          fi
