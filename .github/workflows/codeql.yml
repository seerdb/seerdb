name: CodeQL

on:
  push:
    branches: [master]
    # Docs-only changes have no code for CodeQL to analyse — skip them.
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'docs/**'
      - 'ChangeLog'
      - 'LICENSES/**'
      - 'NOTICE'
      - 'REUSE.toml'
      - '.gitignore'
      - '.git-blame-ignore-revs'
      - '.github/dependabot.yml'
  pull_request:
    # ready_for_review: a draft skips the heavy jobs below, which run once it
    # is undrafted (#1942).
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'docs/**'
      - 'ChangeLog'
      - 'LICENSES/**'
      - 'NOTICE'
      - 'REUSE.toml'
      - '.gitignore'
      - '.git-blame-ignore-revs'
      - '.github/dependabot.yml'
  schedule:
    # Weekly Monday 06:17 UTC — off the hour to dodge cron spikes.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # A draft waits for ready_for_review (#1942).
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Security queries only. ruff (F/W/I) and mypy already own import
          # hygiene, unused imports, and style, so the extra `-and-quality`
          # queries (py/cyclic-import, py/unused-import, py/import-and-import-from)
          # are pure duplicate noise here — and they re-anchor on every reformat.
          queries: security-extended
          # Filters out two queries that flag the Oracle-protocol-mandated DES /
          # MD5 / SHA-1 in seerdb/common/crypto.py — unfixable-by-design false
          # positives. The file stays under every other query; see the config's
          # header comment for the full rationale.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.2
        with:
          category: '/language:${{ matrix.language }}'
